name: Secret scan

# Scans a pull request's history for secrets with gitleaks. The organisation ruleset `secret-scan`
# (infra/projects/saas/github.ts in dinetap-global/core) requires this workflow on every repository's default branch, so
# a repository with no workflow of its own is scanned from its first pull request. It runs in the repository under
# test, reads that repository's .gitleaks.toml when it has one, and needs no secret.
on:
  pull_request:
  merge_group:

permissions: {}

# Explicit bash runs every step with -eo pipefail.
defaults:
  run:
    shell: bash

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the scan reads the commits, not only the files
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Only the history of the commit under test: without --log-opts, gitleaks scans every fetched branch.
      - name: Scan
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts=HEAD
